<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" , maximum-scale="1.0" , user-scalable="no">
    <title>Chain Reaction Mobile</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href=",/assets/imgs/favicon.svg">
    <link rel="alternate icon" href="./assets/imgs/favicon.ico">
    <link rel="apple-touch-icon" href="./assets/imgs/apple-touch-icon.png">
</head>

<body>
    <main class="app-container">
        <header class="game-header">
            <div class="game-top">
                <h1 class="game-title">Chain Reaction</h1>
                <div class="header-buttons">
                    <button id="btn-credits" class="btn-icon" title="Créditos">🗃️</button>
                    <button id="btn-help" class="btn-icon" title="Como Jogar">?</button>
                </div>
            </div>


            <div id="turn-indicator" class="turn-badge player-red">
                Vez do Jogador: <span id="current-player-name">Vermelho</span>
            </div>
        </header>

        <section class="board-container">
            <div id="game-board" class="board-grid">
                <!-- As células do tabuleiro serão geradas pelo JavaScript -->
            </div>
        </section>

        <footer class="game-footer">
            <button id="btn-reset" class="btn-primary">Reiniciar Partida</button>
        </footer>
    </main>

    <!-- 1. MODAL DE VITÓRIA / FIM DE JOGO -->
    <div id="win-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <h2 id="win-title" class="modal-title">🏆 Vitória!</h2>
            <p id="win-message" class="modal-message">O Jogador <span id="winner-name">Vermelho</span> dominou o
                tabuleiro!</p>

            <div class="modal-actions" style="display: flex; gap: 10px; margin-top: 15px;">
                <button id="btn-play-again" class="btn-primary" style="flex: 1;">🔄 Jogar Novamente</button>
                <button id="btn-exit-lobby" class="btn-secondary" style="flex: 1;">🚪 Sair para o Lobby</button>
            </div>
        </div>
    </div>

    <!-- 2. MODAL DE SELEÇÃO DE MODO DE JOGO (LOBBY) -->
    <div id="mode-modal" class="modal-overlay">
        <div class="modal-card">
            <h2 class="modal-title">🎮 Modo de Jogo</h2>
            <p class="modal-message">Como você deseja jogar esta partida?</p>

            <div class="mode-options" style="display: flex; flex-direction: column; gap: 10px; margin-top: 15px;">
                <button id="btn-mode-pvp" class="btn-primary">👥 Jogador vs Jogador</button>
                <button id="btn-mode-pve" class="btn-primary">🤖 Jogador vs CPU</button>
            </div>

            <!-- Opções de Dificuldade da CPU (Visíveis apenas ao escolher jogar vs CPU) -->
            <div id="difficulty-options" class="difficulty-container hidden" style="margin-top: 15px;">
                <p class="modal-message">Escolha o nível da CPU:</p>
                <div class="difficulty-buttons" style="display: flex; gap: 10px; margin-top: 8px;">
                    <button class="btn-secondary btn-diff" data-level="easy" style="flex: 1;">🟢 Fácil</button>
                    <button class="btn-secondary btn-diff" data-level="medium" style="flex: 1;">🟡 Médio</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL DE TUTORIAL INTERATIVO (ONBOARDING) -->
    <div id="tutorial-modal" class="modal-overlay hidden">
        <div class="modal-card tutorial-card">
            <button id="btn-close-tutorial" class="btn-close">&times;</button>

            <!-- Conteúdo Dinâmico do Slide -->
            <div id="tutorial-slide-container">
                <!-- O JS injetará os slides aqui -->
            </div>

            <div class="tutorial-navigation">
                <div id="tutorial-dots" class="dots-container"></div>
                <div class="nav-buttons">
                    <button id="btn-prev-slide" class="btn-secondary">Anterior</button>
                    <button id="btn-next-slide" class="btn-primary">Próximo</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL DE CRÉDITOS -->
    <div id="credits-modal" class="modal-overlay hidden">
        <div class="modal-card credits-card">
            <button id="btn-close-credits" class="btn-close">&times;</button>
            <h2 class="modal-title">🎵 Créditos</h2>
            <p class="modal-message" style="text-align:left;font-size:0.9rem;line-height:1.6">
                <strong style="font-size: 1.25rem;">Decisions</strong><br>
                Kevin MacLeod (incompetech.com)<br. Licenciado sob Creative Commons: Atribuição 4.0<br>
                    <a href="http://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener"
                        style="color:#38bdf8;">
                        creativecommons.org/licenses/by/4.0</a>
            </p>
        </div>
    </div>


    <script type="module" src="./scripts/main.js"></script>

</body>

</html>
